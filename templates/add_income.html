<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Income - Smart Expense Analyzer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<nav class="navbar">

    <div class="container">

        <a href="{{ url_for('home') }}" class="logo">
            💰 Smart Expense Analyzer
        </a>

        <div class="nav-links">

            <a href="{{ url_for('home') }}">
                Dashboard
            </a>

            <a href="{{ url_for('transactions') }}">
                Transactions
            </a>

            <a href="{{ url_for('analysis') }}">
                Analysis
            </a>

        </div>

    </div>

</nav>


<main class="container">

    <section class="page-header">

        <h1>
            Add Income
        </h1>

        <p>
            Record your income and keep track of your earnings.
        </p>

    </section>


    <div class="card">

        <form
            method="POST"
            action="{{ url_for('add_income') }}"
        >

            <div class="form-group">

                <label for="date">
                    Date
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >

            </div>


            <div class="form-group">

                <label for="category">
                    Income Category
                </label>

                <select
                    id="category"
                    name="category"
                    required
                >

                    <option value="">
                        Select Income Category
                    </option>

                    <option value="Salary">
                        Salary
                    </option>

                    <option value="Freelancing">
                        Freelancing
                    </option>

                    <option value="Business">
                        Business
                    </option>

                    <option value="Scholarship">
                        Scholarship
                    </option>

                    <option value="Investment">
                        Investment
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="sub_category">
                    Sub Category
                </label>

                <select
                    id="sub_category"
                    name="sub_category"
                    required
                >

                    <option value="">
                        Select Sub Category
                    </option>

                    <option value="Monthly">
                        Monthly
                    </option>

                    <option value="One Time">
                        One Time
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="amount">
                    Amount (₹)
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    step="0.01"
                    min="0"
                    placeholder="Enter amount"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Enter description (optional)"
                ></textarea>

            </div>


            <div class="quick-actions">

                <button
                    type="submit"
                    class="btn"
                >
                    💰 Add Income
                </button>

                <a
                    href="{{ url_for('home') }}"
                    class="btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</main>


<footer>

    <p>
        © 2026 Smart Expense Analyzer
    </p>

</footer>

</body>

</html>
