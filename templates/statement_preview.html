
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Statement Preview</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            padding: 24px;
        }

        main {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 24px;
            border-radius: 12px;
        }

        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: #f5f5f5;
            padding: 16px;
            border-radius: 8px;
        }

        a {
            color: #2457c5;
        }

        .btn {
            display: inline-block;
            background: #2457c5;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
    </style>
</head>

<body>
    <main>
        <h1>Bank Statement Preview</h1>

        <p>Check the extracted text before importing transactions.</p>

        <pre>{{ extracted_text }}</pre>

        <div class="actions">
            <form action="{{ url_for('import_statement') }}" method="POST">
                <input
                    type="hidden"
                    name="extracted_text"
                    value="{{ extracted_text }}"
                >

                <button class="btn" type="submit">
                    Import Transactions
                </button>
            </form>

            <a href="{{ url_for('upload_statement') }}">
                Upload another PDF
            </a>

            <a href="{{ url_for('home') }}">
                Back to Dashboard
            </a>
        </div>
    </main>
</body>
</html>
